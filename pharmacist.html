<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薬剤師・看護師 管理ポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
    }

    body {
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: auto;
      max-height: 92vh;
      background-color: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 6px solid #1a252f;
      position: relative;
    }

    .app-header {
      background-color: #fffaf0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ffe0b2;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 900;
      color: #e67e22;
    }

    .header-mini-btn {
      background: #34495e;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .app-content {
      overflow-y: auto;
      background-color: #fcfcfc;
    }

    .screen {
      display: none;
      padding: 14px 16px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    .pharmacist-container h3,
    .carte-container h3 {
      font-size: 0.95rem;
      font-weight: 900;
      color: #333;
      margin-bottom: 6px;
    }

    .pharmacist-container h4,
    .carte-container h4 {
      font-size: 0.82rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 4px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #444;
      margin-top: 6px;
      margin-bottom: 2px;
      display: block;
    }

    input[type="text"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 7px 8px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 4px;
      background-color: #fff;
      color: #333;
      user-select: text;
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .divider {
      margin: 10px 0;
      border: 0;
      height: 1px;
      background: #ddd;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      background: #2ecc71;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 8px;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-orange {
      background-color: #e67e22;
      margin-top: 12px;
    }

    .btn-blue {
      background-color: #2980b9;
      padding: 8px;
      font-size: 0.85rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .btn-green {
      background-color: #27ae60;
      padding: 9px;
      font-size: 0.88rem;
    }

    .target-patient-box {
      background: #fff3e0;
      border: 1.5px solid #ffe0b2;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .target-patient-box span {
      font-weight: 900;
      color: #e67e22;
    }

    .target-id-line {
      background: #fff;
      border: 1px solid #f39c12;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #d35400;
    }

    .instruction-box {
      background: #f8f9fa;
      border-left: 3px solid #27ae60;
      padding: 6px 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #555;
      line-height: 1.35;
    }

    #qr-reader-container {
      display: none;
      margin-bottom: 8px;
    }

    #qr-reader {
      width: 100%;
    }

    .cancel-scan-btn {
      margin-top: 4px;
      width: 100%;
      padding: 6px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 8px;
      background: #fff;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      margin: 0;
      cursor: pointer;
    }

    .registered-medicines-list {
      margin-top: 8px;
    }

    #medicine-list {
      list-style: none;
      max-height: 90px;
      overflow-y: auto;
    }

    #medicine-list li {
      background: #fff;
      border: 1.5px solid #eee;
      border-radius: 8px;
      padding: 5px 8px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .del-med-btn {
      background: #ffe3e3;
      color: #e03131;
      border: none;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .back-step-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: #7f8c8d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .carte-header-badge {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .issued-id-banner {
      background: linear-gradient(135deg, #ebf5fb 0%, #d6eaf8 100%);
      border: 2px solid #2980b9;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }

    .issued-id-label {
      font-size: 0.78rem;
      font-weight: 900;
      color: #1f618d;
    }

    .issued-id-number {
      font-size: 1.9rem;
      font-weight: 900;
      color: #154360;
      letter-spacing: 0.12em;
      margin: 2px 0;
      user-select: text;
    }

    .issued-id-note {
      font-size: 0.72rem;
      color: #2c3e50;
    }

    .carte-card {
      background: #fff;
      border: 2px solid #dfe6e9;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .carte-patient-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: #2d3436;
      border-bottom: 2px solid #e67e22;
      padding-bottom: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .carte-sub {
      font-size: 0.72rem;
      font-weight: 500;
      color: #7f8c8d;
    }

    .carte-section {
      margin-bottom: 10px;
    }

    .carte-schedule-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 8px;
      background: #f8f9fa;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .carte-med-list {
      list-style: none;
    }

    .carte-med-list li {
      background: #eef7f2;
      border-left: 3px solid #27ae60;
      padding: 6px 8px;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <header class="app-header">
      <div class="header-title">薬剤師 管理ポータル</div>
      <button type="button" id="header-carte-btn" class="header-mini-btn">📋 診察カルテ</button>
    </header>

    <main class="app-content">
      <!-- 画面1: 患者選択 & 生活時間設定 -->
      <section id="screen-step1" class="screen active">
        <div class="pharmacist-container">
          
          <div class="patient-section">
            <h3>1. 患者の入力・選択</h3>
            
            <label for="patient-name-input">新規患者名（新しく登録してIDを発行する場合）</label>
            <input type="text" id="patient-name-input" placeholder="例: 山田 太郎">

            <label for="patient-select">または登録済みの患者から選択</label>
            <select id="patient-select">
              <option value="">-- 患者を選択してください --</option>
            </select>
          </div>

          <hr class="divider">

          <div class="edit-patient-section">
            <h3>2. 生活時間（ご飯・お風呂）の設定</h3>
            <form id="edit-schedule-form">
              <div class="time-grid">
                <div>
                  <label for="sched-bf">朝ごはん</label>
                  <input type="time" id="sched-bf" value="07:00">
                </div>
                <div>
                  <label for="sched-lunch">昼ごはん</label>
                  <input type="time" id="sched-lunch" value="12:00">
                </div>
                <div>
                  <label for="sched-dinner">晩ごはん</label>
                  <input type="time" id="sched-dinner" value="19:00">
                </div>
                <div>
                  <label for="sched-bath">お風呂</label>
                  <input type="time" id="sched-bath" value="17:00">
                </div>
              </div>

              <button type="submit" id="next-step-btn" class="action-btn btn-orange">次へ（お薬登録） ➔</button>
            </form>
          </div>

        </div>
      </section>

      <!-- 画面2: 服薬情報・QR読み取り -->
      <section id="screen-step2" class="screen">
        <div class="pharmacist-container">
          
          <div class="target-patient-box">
            <div><strong>対象患者: </strong><span id="target-patient-name">未指定</span></div>
            <div class="target-id-line">発行ID: <strong id="target-patient-id">----</strong></div>
          </div>

          <div class="edit-medicine-section">
            <h3>処方薬・服用タイミングの設定</h3>

            <div class="instruction-box">
              <strong>【手順】</strong> ①QRまたは手入力でセット → ②タイミング確認 → ③「この薬をリストに追加」
            </div>

            <button type="button" id="start-scan-btn" class="action-btn btn-blue">📷 QRコードから読み込む</button>
            <div id="qr-reader-container">
              <div id="qr-reader"></div>
              <button type="button" id="stop-scan-btn" class="cancel-scan-btn">キャンセル</button>
            </div>

            <form id="add-medicine-form">
              <label for="med-name">薬品名</label>
              <input type="text" id="med-name" placeholder="例: ロキソニン" required>

              <label for="med-dosage">1回の量・注意点</label>
              <input type="text" id="med-dosage" placeholder="例: 1錠（毎食後）">

              <label>いつ飲むか（複数選択可）</label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="med-timing" value="朝"> 朝</label>
                <label><input type="checkbox" name="med-timing" value="昼"> 昼</label>
                <label><input type="checkbox" name="med-timing" value="夕"> 夕</label>
                <label><input type="checkbox" name="med-timing" value="就寝前"> 就寝前</label>
                <label><input type="checkbox" name="med-timing" value="頓服"> 頓服</label>
              </div>

              <button type="submit" class="action-btn btn-green">＋ この薬をリストに追加</button>
            </form>

            <div class="registered-medicines-list">
              <h4>登録予定のお薬</h4>
              <ul id="medicine-list"></ul>
            </div>

            <button type="button" id="complete-patient-btn" class="action-btn btn-orange" style="margin-top: 12px;">✅ 患者データを確定してIDを発行する</button>
            <button type="button" id="back-to-step1-btn" class="back-step-btn">⬅ 患者・生活時間設定に戻る</button>
          </div>

        </div>
      </section>

      <!-- 画面3: 診察カルテ & 患者ID案内画面 -->
      <section id="screen-carte" class="screen">
        <div class="carte-container">
          <div class="carte-header-badge">🩺 診察・服薬カルテ確認</div>

          <label for="carte-patient-select">表示する患者を切り替え</label>
          <select id="carte-patient-select"></select>

          <div class="issued-id-banner">
            <div class="issued-id-label">📲 患者側アプリに入力するID</div>
            <div class="issued-id-number" id="carte-issued-id">1001</div>
            <div class="issued-id-note">患者さんのアプリ初回画面でこの4桁のIDを入力してください</div>
          </div>

          <div class="carte-card">
            <div class="carte-patient-title">
              <span id="carte-name">---</span> 様
              <span class="carte-sub" id="carte-date">登録日: ---</span>
            </div>

            <div class="carte-section">
              <h4>⏰ 生活スケジュール</h4>
              <div class="carte-schedule-grid" id="carte-schedule-list"></div>
            </div>

            <div class="carte-section">
              <h4>💊 処方薬・服用タイミング</h4>
              <ul class="carte-med-list" id="carte-med-list"></ul>
            </div>

            <div class="carte-section">
              <h4>📝 診察メモ</h4>
              <textarea id="carte-memo" rows="2" placeholder="診察時の所見や申し送り事項を入力..."></textarea>
              <button type="button" id="save-memo-btn" class="action-btn btn-blue" style="margin-top: 6px; padding: 6px;">メモを保存</button>
            </div>
          </div>

          <button type="button" id="new-register-btn" class="action-btn btn-green">＋ 新しい患者・お薬を登録する</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SHARED_STORAGE_KEY = 'brain_med_app_data';

    const defaultData = {
      currentPatientId: '1001',
      patients: [
        {
          id: '1001',
          name: '眞野 宏太',
          updatedAt: '2026/11/16',
          memo: '血圧安定。食後の飲み忘れに注意。',
          schedule: [
            { label: '朝ごはん', time: '07:00' },
            { label: '昼ごはん', time: '12:00' },
            { label: '晩ごはん', time: '19:00' },
            { label: 'お風呂', time: '17:00' }
          ],
          meds: [
            { name: 'ロキソニン', dosage: '1錠', timing: ['朝', '昼', '夕'] }
          ]
        }
      ]
    };

    function getData() {
      try {
        const saved = localStorage.getItem(SHARED_STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.patients) && parsed.patients.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('読み込みエラー:', e);
      }
      saveData(defaultData);
      return JSON.parse(JSON.stringify(defaultData));
    }

    function saveData(data) {
      try {
        localStorage.setItem(SHARED_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('保存エラー:', e);
      }
    }

    function generateNextPatientId(patients) {
      let maxNum = 1000;
      patients.forEach(p => {
        const num = parseInt(String(p.id), 10);
        if (!isNaN(num) && num >= 1000 && num < 10000 && num > maxNum) {
          maxNum = num;
        }
      });
      return String(maxNum + 1);
    }

    let appData = getData();
    let html5QrCode = null;
    let draftPatient = null;

    document.addEventListener('DOMContentLoaded', () => {
      const step1 = document.getElementById('screen-step1');
      const step2 = document.getElementById('screen-step2');
      const stepCarte = document.getElementById('screen-carte');

      const patientInput = document.getElementById('patient-name-input');
      const patientSelect = document.getElementById('patient-select');
      const targetPatientName = document.getElementById('target-patient-name');
      const targetPatientId = document.getElementById('target-patient-id');
      const editScheduleForm = document.getElementById('edit-schedule-form');
      const medicineList = document.getElementById('medicine-list');

      function showScreen(targetScreen) {
        stopScanner();
        [step1, step2, stepCarte].forEach(s => s.classList.remove('active'));
        targetScreen.classList.add('active');
      }

      renderPatientSelect();
      loadCurrentSchedule();

      document.getElementById('header-carte-btn').addEventListener('click', () => {
        renderCarteScreen(appData.currentPatientId);
        showScreen(stepCarte);
      });

      patientSelect.addEventListener('change', (e) => {
        const selectedId = e.target.value;
        if (selectedId) {
          appData.currentPatientId = selectedId;
          patientInput.value = '';
          loadCurrentSchedule();
        }
      });

      editScheduleForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const newName = patientInput.value.trim();
        const scheduleData = [
          { label: '朝ごはん', time: document.getElementById('sched-bf').value || '07:00' },
          { label: '昼ごはん', time: document.getElementById('sched-lunch').value || '12:00' },
          { label: '晩ごはん', time: document.getElementById('sched-dinner').value || '19:00' },
          { label: 'お風呂', time: document.getElementById('sched-bath').value || '17:00' }
        ];

        if (newName) {
          const issuedId = generateNextPatientId(appData.patients);
          draftPatient = {
            id: issuedId,
            name: newName,
            updatedAt: new Date().toLocaleDateString('ja-JP'),
            memo: '',
            schedule: scheduleData,
            meds: [],
            isNew: true
          };
          targetPatientName.textContent = `${draftPatient.name}（新規）`;
          if (targetPatientId) targetPatientId.textContent = issuedId;
        } else {
          const existing = appData.patients.find(p => String(p.id) === String(appData.currentPatientId)) || appData.patients[0];
          draftPatient = {
            ...existing,
            schedule: scheduleData,
            meds: existing ? [...existing.meds] : [],
            isNew: false
          };
          targetPatientName.textContent = draftPatient ? draftPatient.name : '未指定';
          if (targetPatientId) targetPatientId.textContent = draftPatient ? draftPatient.id : '----';
        }

        renderDraftMedicineList();
        showScreen(step2);
      });

      document.getElementById('add-medicine-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!draftPatient) return;

        const name = cleanProductName(document.getElementById('med-name').value);
        const dosage = document.getElementById('med-dosage').value;
        const checkedTimings = Array.from(document.querySelectorAll('input[name="med-timing"]:checked')).map(cb => cb.value);

        draftPatient.meds.push({
          name: name,
          dosage: dosage || '指定なし',
          timing: checkedTimings
        });

        renderDraftMedicineList();
        e.target.reset();
      });

      document.getElementById('complete-patient-btn').addEventListener('click', () => {
        if (!draftPatient) return;

        draftPatient.updatedAt = new Date().toLocaleDateString('ja-JP');

        if (draftPatient.isNew) {
          delete draftPatient.isNew;
          appData.patients.push(draftPatient);
        } else {
          const idx = appData.patients.findIndex(p => String(p.id) === String(draftPatient.id));
          if (idx !== -1) {
            delete draftPatient.isNew;
            appData.patients[idx] = draftPatient;
          }
        }

        appData.currentPatientId = draftPatient.id;
        saveData(appData);

        patientInput.value = '';
        renderPatientSelect();

        renderCarteScreen(draftPatient.id);
        showScreen(stepCarte);
      });

      document.getElementById('back-to-step1-btn').addEventListener('click', () => {
        showScreen(step1);
      });

      document.getElementById('carte-patient-select').addEventListener('change', (e) => {
        const id = e.target.value;
        if (id) {
          appData.currentPatientId = id;
          saveData(appData);
          renderCarteScreen(id);
        }
      });

      document.getElementById('save-memo-btn').addEventListener('click', () => {
        const patient = appData.patients.find(p => String(p.id) === String(appData.currentPatientId));
        if (patient) {
          patient.memo = document.getElementById('carte-memo').value;
          saveData(appData);
          alert('診察メモを保存しました。');
        }
      });

      document.getElementById('new-register-btn').addEventListener('click', () => {
        patientInput.value = '';
        patientSelect.value = '';
        showScreen(step1);
      });

      function renderPatientSelect() {
        patientSelect.innerHTML = '<option value="">-- 患者を選択してください --</option>' +
          appData.patients.map(p => `
            <option value="${p.id}" ${String(p.id) === String(appData.currentPatientId) ? 'selected' : ''}>
              [ID: ${p.id}] ${p.name}
            </option>
          `).join('');
      }

      function loadCurrentSchedule() {
        const patient = appData.patients.find(p => String(p.id) === String(appData.currentPatientId));
        if (!patient) return;

        const bf = patient.schedule.find(s => s.label === '朝ごはん');
        const lunch = patient.schedule.find(s => s.label === '昼ごはん');
        const dinner = patient.schedule.find(s => s.label === '晩ごはん');
        const bath = patient.schedule.find(s => s.label === 'お風呂');

        if (bf) document.getElementById('sched-bf').value = bf.time;
        if (lunch) document.getElementById('sched-lunch').value = lunch.time;
        if (dinner) document.getElementById('sched-dinner').value = dinner.time;
        if (bath) document.getElementById('sched-bath').value = bath.time;
      }

      function renderDraftMedicineList() {
        medicineList.innerHTML = '';
        if (!draftPatient || !draftPatient.meds) return;

        draftPatient.meds.forEach((med, idx) => {
          const li = document.createElement('li');
          const timingsStr = med.timing && med.timing.length > 0 ? med.timing.join(', ') : '指定なし';
          li.innerHTML = `
            <span><strong>${med.name}</strong> (${med.dosage}) [${timingsStr}]</span>
            <button type="button" class="del-med-btn" data-idx="${idx}">削除</button>
          `;
          li.querySelector('.del-med-btn').addEventListener('click', () => {
            draftPatient.meds.splice(idx, 1);
            renderDraftMedicineList();
          });
          medicineList.appendChild(li);
        });
      }

      function renderCarteScreen(patientId) {
        const carteSelect = document.getElementById('carte-patient-select');
        carteSelect.innerHTML = appData.patients.map(p => `
          <option value="${p.id}" ${String(p.id) === String(patientId) ? 'selected' : ''}>
            [ID: ${p.id}] ${p.name} 様
          </option>
        `).join('');

        const patient = appData.patients.find(p => String(p.id) === String(patientId)) || appData.patients[0];
        if (!patient) return;

        const issuedIdEl = document.getElementById('carte-issued-id');
        if (issuedIdEl) issuedIdEl.textContent = patient.id;

        document.getElementById('carte-name').textContent = patient.name;
        document.getElementById('carte-date').textContent = `更新日: ${patient.updatedAt || '本日'}`;
        document.getElementById('carte-memo').value = patient.memo || '';

        const schedContainer = document.getElementById('carte-schedule-list');
        schedContainer.innerHTML = patient.schedule.map(s => `
          <div><strong>${s.label}:</strong> ${s.time}</div>
        `).join('');

        const medContainer = document.getElementById('carte-med-list');
        if (patient.meds.length === 0) {
          medContainer.innerHTML = '<li style="background:#f9f9f9; border-color:#ccc;">登録されたお薬はありません</li>';
        } else {
          medContainer.innerHTML = patient.meds.map(m => `
            <li>
              <strong>${m.name}</strong>（${m.dosage}）<br>
              <span style="color:#27ae60; font-weight:bold;">服用: ${m.timing.join('・') || '指定なし'}</span>
            </li>
          `).join('');
        }
      }

      const startBtn = document.getElementById('start-scan-btn');
      const stopBtn = document.getElementById('stop-scan-btn');
      const readerContainer = document.getElementById('qr-reader-container');

      startBtn.addEventListener('click', () => {
        if (typeof Html5Qrcode === 'undefined') {
          alert('QR読み取りライブラリの読み込み中です。');
          return;
        }
        readerContainer.style.display = 'block';
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode('qr-reader');
        }

        html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            parseMedicineQR(decodedText);
            stopScanner();
          },
          () => {}
        ).catch(err => {
          alert('カメラの起動に失敗しました: ' + err);
          readerContainer.style.display = 'none';
        });
      });

      stopBtn.addEventListener('click', stopScanner);

      function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
          html5QrCode.stop().then(() => {
            readerContainer.style.display = 'none';
          }).catch(() => {
            readerContainer.style.display = 'none';
          });
        } else {
          readerContainer.style.display = 'none';
        }
      }

      function cleanProductName(text) {
        return text.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/g, '').trim();
      }

      function parseMedicineQR(text) {
        let medName = '';
        let dosage = '';
        let timings = [];

        const lines = text.split('\n');
        let isJahis = false;

        lines.forEach(line => {
          const cols = line.split(',');
          if (cols[0] === '201' || cols[0] === '281') {
            isJahis = true;
            medName = cols[4] || cols[3] || medName;
            if (cols[5]) dosage = cols[5] + (cols[6] || '');
          }
          if (cols[0] === '301' || cols[0] === '311') {
            const usageText = cols[4] || '';
            extractTimings(usageText, timings);
          }
        });

        if (!isJahis) {
          try {
            const data = JSON.parse(text);
            medName = data.name || '';
            dosage = data.dosage || '';
            if (Array.isArray(data.timing)) timings = data.timing;
          } catch (e) {
            medName = text.split(/\s+/)[0] || text;
            extractTimings(text, timings);
          }
        }

        medName = cleanProductName(medName);

        if (medName) document.getElementById('med-name').value = medName;
        if (dosage) document.getElementById('med-dosage').value = dosage;

        const checkboxes = document.querySelectorAll('input[name="med-timing"]');
        checkboxes.forEach(cb => {
          cb.checked = timings.includes(cb.value);
        });
      }

      function extractTimings(str, targetArray) {
        if (str.includes('朝')) targetArray.push('朝');
        if (str.includes('昼')) targetArray.push('昼');
        if (str.includes('夕') || str.includes('夜')) targetArray.push('夕');
        if (str.includes('寝') || str.includes('就寝')) targetArray.push('就寝前');
        if (str.includes('頓') || str.includes('痛')) targetArray.push('頓服');
      }
    });
  </script>
</body>
</html>
