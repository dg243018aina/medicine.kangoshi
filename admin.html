<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薬剤師用 管理画面</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="phone-frame">
    <header class="app-header admin-header">
      <div class="header-title" style="color: #e67e22;">薬剤師 管理ポータル</div>
    </header>

    <main class="app-content">
      <section class="screen active">
        <div class="pharmacist-container">
          <h3>患者選択</h3>
          <div class="patient-select-list" id="pharmacist-patient-list"></div>

          <hr class="divider">

          <div class="edit-patient-section">
            <h3>生活時間（ご飯・お風呂）の設定</h3>
            <form id="edit-schedule-form">
              <label>朝ごはん</label>
              <input type="text" id="sched-bf" placeholder="7:00">
              <label>昼ごはん</label>
              <input type="text" id="sched-lunch" placeholder="12:00">
              <label>晩ごはん</label>
              <input type="text" id="sched-dinner" placeholder="19:00">
              <label>お風呂</label>
              <input type="text" id="sched-bath" placeholder="17:00">
              <button type="submit" class="action-btn" style="background:#e67e22; margin-top:10px;">生活時間を更新する</button>
            </form>

            <hr class="divider">

            <h3>新しい処方薬の追加</h3>
            <form id="add-med-form">
              <label>薬の名前</label>
              <input type="text" id="input-med-name" placeholder="例: ロキソニン" required>
              
              <label>服用タイミング・用法</label>
              <input type="text" id="input-med-instruction" placeholder="例: 朝 食後 2錠" required>
              
              <button type="submit" class="action-btn" style="margin-top:10px;">お薬を登録する</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
