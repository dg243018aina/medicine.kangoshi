<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看護師用 管理ポータル</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- QRコード読み取り用ライブラリ -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    /* 画面切り替え用のスタイル（!important で確実に適用） */
    .screen {
      display: none !important;
    }
    .screen.active {
      display: block !important;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <header class="app-header admin-header">
      <div class="header-title" style="color: #e67e22;">看護師 管理ポータル</div>
    </header>

    <main class="app-content">
      <!-- 画面1: 患者選択 & 生活時間設定 -->
      <section id="screen-step1" class="screen active">
        <div class="pharmacist-container">
          
          <!-- 患者入力・選択エリア -->
          <div class="patient-section">
            <h3>患者選択</h3>
            
            <form id="add-patient-form" style="margin-bottom: 12px;">
              <label for="patient-name-input">新規患者登録</label>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="patient-name-input" placeholder="例: 山田 太郎" style="flex: 1;">
                <button type="submit" class="action-btn" style="background: #3498db; width: auto; padding: 0 15px;">追加</button>
              </div>
            </form>

            <label for="patient-select">対象の患者を選択</label>
            <select id="patient-select" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">
              <option value="">-- 患者を選択してください --</option>
              <option value="山田 太郎">山田 太郎</option>
              <option value="佐藤 花子">佐藤 花子</option>
            </select>
          </div>

          <hr class="divider">

          <!-- 生活時間設定エリア -->
          <div class="edit-patient-section">
            <h3>生活時間（ご飯・お風呂）の設定</h3>
            <form id="edit-schedule-form">
              <label for="sched-bf">朝ごはん</label>
              <input type="time" id="sched-bf" value="07:00">

              <label for="sched-lunch">昼ごはん</label>
              <input type="time" id="sched-lunch" value="12:00">

              <label for="sched-dinner">晩ごはん</label>
              <input type="time" id="sched-dinner" value="19:00">

              <label for="sched-bath">お風呂</label>
              <input type="time" id="sched-bath" value="17:00">

              <button type="submit" class="action-btn" style="background:#e67e22; margin-top: 15px;">保存して次へ（お薬登録） ➔</button>
            </form>
          </div>

        </div>
      </section>

      <!-- 画面2: 服薬情報・QR読み取り -->
      <section id="screen-step2" class="screen">
        <div class="pharmacist-container">
          
          <!-- 選択中の患者情報表示 -->
          <div style="background: #fff3e0; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
            <strong>対象患者: </strong><span id="target-patient-name" style="font-weight: bold; color: #e67e22;">未指定</span>
          </div>

          <div class="edit-medicine-section">
            <h3>処方薬・服用タイミングの設定</h3>

            <div class="instruction-box" style="background: #f8f9fa; border-left: 4px solid #27ae60; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
              <p style="font-weight: bold; margin: 0 0 5px 0; font-size: 0.9rem;">【お薬登録手順】</p>
              <ol style="margin: 0; padding-left: 20px; font-size: 0.85rem; color: #333;">
                <li>「QR読み取り」または手入力で薬品情報をセットします。</li>
                <li>服用タイミングを確認・変更します。</li>
                <li>「薬を追加・登録」を押すと下の登録リストに反映されます。</li>
              </ol>
            </div>

            <button type="button" id="start-scan-btn" class="action-btn" style="background:#2980b9; margin-bottom: 10px;">📷 QRコードから読み込む</button>
            <div id="qr-reader-container" style="display:none; margin-bottom: 15px;">
              <div id="qr-reader" style="width: 100%;"></div>
              <button type="button" id="stop-scan-btn" style="margin-top: 5px; width: 100%; padding: 6px; background:#e74c3c; color:#fff; border:none; border-radius:4px;">キャンセル</button>
            </div>

            <form id="add-medicine-form">
              <label for="med-name">薬品名</label>
              <input type="text" id="med-name" placeholder="例: ロキソニン" required>

              <label for="med-dosage">1回の量・注意点</label>
              <input type="text" id="med-dosage" placeholder="例: 1錠（毎食後）">

              <label>いつ飲むか（複数選択可）</label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="med-timing" value="朝"> 朝</label>
                <label><input type="checkbox" name="med-timing" value="昼"> 昼</label>
                <label><input type="checkbox" name="med-timing" value="夕"> 夕</label>
                <label><input type="checkbox" name="med-timing" value="就寝前"> 就寝前</label>
                <label><input type="checkbox" name="med-timing" value="頓服"> 痛むとき（頓服）</label>
              </div>

              <button type="submit" class="action-btn" style="background:#27ae60; margin-top: 10px;">薬を追加・登録</button>
            </form>

            <div class="registered-medicines-list" style="margin-top: 15px;">
              <h4>登録中のお薬</h4>
              <ul id="medicine-list"></ul>
            </div>

            <button type="button" id="back-to-step1-btn" style="margin-top: 20px; width: 100%; padding: 10px; background: #7f8c8d; color: white; border: none; border-radius: 4px; font-weight: bold;">⬅ 生活時間設定に戻る</button>
          </div>

        </div>
      </section>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let html5QrCode = null;

      const step1 = document.getElementById('screen-step1');
      const step2 = document.getElementById('screen-step2');
      const addPatientForm = document.getElementById('add-patient-form');
      const patientInput = document.getElementById('patient-name-input');
      const patientSelect = document.getElementById('patient-select');
      const targetPatientName = document.getElementById('target-patient-name');
      const editScheduleForm = document.getElementById('edit-schedule-form');
      const backBtn = document.getElementById('back-to-step1-btn');

      // 新しい患者名の追加
      addPatientForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const newName = patientInput.value.trim();
        if (newName) {
          const option = document.createElement('option');
          option.value = newName;
          option.textContent = newName;
          option.selected = true;
          patientSelect.appendChild(option);
          patientInput.value = '';
        }
      });

      // 「保存して次へ」ボタンで無条件に画面2へ遷移
      editScheduleForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // 選択された患者名を表示（未選択の場合は「未指定」）
        const selectedPatient = patientSelect.value;
        targetPatientName.textContent = selectedPatient ? selectedPatient : '未指定';

        // 画面切替
        step1.classList.remove('active');
        step2.classList.add('active');
      });

      // 画面1へ戻る
      backBtn.addEventListener('click', () => {
        stopScanner();
        step2.classList.remove('active');
        step1.classList.add('active');
      });

      // QR読み取り処理
      const startBtn = document.getElementById('start-scan-btn');
      const stopBtn = document.getElementById('stop-scan-btn');
      const readerContainer = document.getElementById('qr-reader-container');

      startBtn.addEventListener('click', () => {
        readerContainer.style.display = 'block';
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("qr-reader");
        }

        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            parseMedicineQR(decodedText);
            stopScanner();
          },
          () => {}
        ).catch(err => {
          alert("カメラの起動に失敗しました: " + err);
          readerContainer.style.display = 'none';
        });
      });

      stopBtn.addEventListener('click', stopScanner);

      function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
          html5QrCode.stop().then(() => {
            readerContainer.style.display = 'none';
          }).catch(() => {
            readerContainer.style.display = 'none';
          });
        } else {
          readerContainer.style.display = 'none';
        }
      }

      function parseMedicineQR(text) {
        let medName = "";
        let dosage = "";
        let timings = [];

        const lines = text.split('\n');
        let isJahis = false;

        lines.forEach(line => {
          const cols = line.split(',');
          if (cols[0] === '201' || cols[0] === '281') {
            isJahis = true;
            medName = cols[4] || cols[3] || medName;
            if (cols[5]) dosage = cols[5] + (cols[6] || '');
          }
          if (cols[0] === '301' || cols[0] === '311') {
            const usageText = cols[4] || '';
            extractTimings(usageText, timings);
          }
        });

        if (!isJahis) {
          try {
            const data = JSON.parse(text);
            medName = data.name || "";
            dosage = data.dosage || "";
            if (Array.isArray(data.timing)) timings = data.timing;
          } catch (e) {
            medName = text.split(/\s+/)[0] || text;
            extractTimings(text, timings);
          }
        }

        if (medName) document.getElementById('med-name').value = medName;
        if (dosage) document.getElementById('med-dosage').value = dosage;

        const checkboxes = document.querySelectorAll('input[name="med-timing"]');
        checkboxes.forEach(cb => {
          cb.checked = timings.includes(cb.value);
        });

        alert(`お薬情報を取り込みました:\n薬品名: ${medName || '未取得'}`);
      }

      function extractTimings(str, targetArray) {
        if (str.includes('朝')) targetArray.push('朝');
        if (str.includes('昼')) targetArray.push('昼');
        if (str.includes('夕') || str.includes('夜')) targetArray.push('夕');
        if (str.includes('寝') || str.includes('就寝')) targetArray.push('就寝前');
        if (str.includes('頓') || str.includes('痛')) targetArray.push('頓服');
      }

      document.getElementById('add-medicine-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('med-name').value;
        const dosage = document.getElementById('med-dosage').value;
        const checkedTimings = Array.from(document.querySelectorAll('input[name="med-timing"]:checked')).map(cb => cb.value);

        const li = document.createElement('li');
        li.textContent = `${name} - ${dosage || '指定なし'} [${checkedTimings.join(', ') || 'タイミング指定なし'}]`;
        document.getElementById('medicine-list').appendChild(li);

        e.target.reset();
      });
    });
  </script>
</body>
</html>
